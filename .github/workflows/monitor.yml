name: courtlistener-monitor
on:
  # 정기 실행은 Claude 예약 작업이 맡는다. 여기선 수동 실행만 남긴다.
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "텔레그램 시험 메시지 먼저 보내기"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: monitor
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run monitor
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN || vars.COURTLISTENER_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || vars.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO || vars.MAIL_TO }}
        run: |
          for v in COURTLISTENER_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -n "${!v}" ]; then echo "$v: 설정됨"; else echo "$v: 비어 있음 (Settings → Secrets and variables → Actions → Secrets 탭 확인)"; fi
          done
          if [ "${{ inputs.telegram_test }}" = "true" ]; then python monitor.py --telegram-test; fi
          python monitor.py
      - name: Save state
        run: |
          git config user.name "cl-monitor"
          git config user.email "cl-monitor@users.noreply.github.com"
          git add state reports
          git diff --cached --quiet || git commit -m "monitor: $(date -u +%FT%RZ)"
          git push
